<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ebe8e5" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#ebe8e5" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="109" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#E1E1DE"/>

    <rect width="1440.0" height="463.8" fill="#d3d1cc"/>
    <rect y="463.8" width="1440.0" height="616.2" fill="#948b81"/>

    <rect x="828.8" width="240.6" height="48.6" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="828.8,0 1069.4,0 464.6,1080.0 -35.2,1080.0"
               fill="#FFFFFF" opacity="0.2"/>
    </g>

    <rect x="1089.9" width="50.4" height="463.8" fill="#7b7266"/>
    <polygon points="1089.9,463.8 1140.3,463.8 801.9,1080.0 701.1,1080.0"
             fill="#615c55" opacity="0.34" filter="url(#soft)"/>

    <rect y="463.8" width="1440.0" height="4.3" fill="#615c55" opacity="0.45"/>
    <rect y="747.2" width="1440.0" height="3.2" fill="#615c55" opacity="0.22"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

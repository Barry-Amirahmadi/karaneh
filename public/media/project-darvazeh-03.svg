<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#dfdad3" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dfdad3" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="446.7" fill="#322f2c"/>
    <rect y="446.7" width="1440.0" height="633.3" fill="#443e36"/>

    <rect x="816.4" width="244.5" height="48.6" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="816.4,0 1060.8,0 456.0,1080.0 -47.6,1080.0"
               fill="#FFFFFF" opacity="0.2"/>
    </g>

    <rect x="1030.3" width="50.4" height="446.7" fill="#4e453a"/>
    <polygon points="1030.3,446.7 1080.7,446.7 742.3,1080.0 641.5,1080.0"
             fill="#0f0f11" opacity="0.34" filter="url(#soft)"/>

    <rect y="446.7" width="1440.0" height="4.3" fill="#0f0f11" opacity="0.45"/>
    <rect y="738.0" width="1440.0" height="3.2" fill="#0f0f11" opacity="0.22"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#e7d7cc" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e7d7cc" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="62" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="682.0" height="1080.0" fill="#433a34"/>
    <rect x="682.0" width="758.0" height="1080.0" fill="#A9704A"/>

    <rect x="658.9" width="46.1" height="1080.0" fill="#0f0f11" opacity="0.85"/>
    <rect x="705.0" width="7.2" height="1080.0" fill="#FFFFFF" opacity="0.28"/>

    <rect x="728.0" y="154.3" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>
    <rect x="728.0" y="308.6" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>
    <rect x="728.0" y="462.9" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>
    <rect x="728.0" y="617.1" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>
    <rect x="728.0" y="771.4" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>
    <rect x="728.0" y="925.7" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>
    <rect x="728.0" y="1080.0" width="712.0" height="3.8" fill="#0f0f11" opacity="0.3"/>

    <g filter="url(#soft)">
      <polygon points="1440.0,0 1440.0,540.0 144.0,1080.0 -288.0,1080.0 -288.0,0"
               fill="#FFFFFF" opacity="0.1"/>
    </g>
    <rect y="950.4" width="1440.0" height="129.6" fill="#0f0f11" opacity="0.22" filter="url(#soft)"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#edeae7" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#edeae7" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="107" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#E1E1DE"/>

    <rect width="1440.0" height="679.4" fill="#d5d3cd"/>
    <rect y="679.4" width="1440.0" height="400.6" fill="#9a9286"/>
    <rect width="1440.0" height="75.6" fill="#666058" opacity="0.5"/>

    <rect x="854.5" y="79.3" width="399.3" height="600.2" fill="url(#open)"/>
    <rect x="854.5" y="79.3" width="11.5" height="600.2" fill="#666058" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="854.5,679.4 1253.9,679.4 821.9,1080.0 220.9,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="453.7" width="57.6" height="679.4" fill="#82796c"/>
    <polygon points="453.7,679.4 511.3,679.4 352.9,1080.0 237.7,1080.0"
             fill="#666058" opacity="0.32" filter="url(#soft)"/>

    <rect x="86.4" y="550.5" width="489.6" height="129.0" fill="#7C6A52"/>
    <rect x="86.4" y="550.5" width="489.6" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#d6d8d9" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#d6d8d9" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="31" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="709.9" fill="#2b2d30"/>
    <rect y="709.9" width="1440.0" height="370.1" fill="#383c3f"/>
    <rect width="1440.0" height="75.6" fill="#0f0f11" opacity="0.5"/>

    <rect x="821.4" y="83.9" width="374.7" height="626.1" fill="url(#open)"/>
    <rect x="821.4" y="83.9" width="11.5" height="626.1" fill="#0f0f11" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="821.4,709.9 1196.1,709.9 764.1,1080.0 187.8,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="348.8" width="57.6" height="709.9" fill="#3e4245"/>
    <polygon points="348.8,709.9 406.4,709.9 248.0,1080.0 132.8,1080.0"
             fill="#0f0f11" opacity="0.32" filter="url(#soft)"/>

    <rect x="86.4" y="590.0" width="489.6" height="119.9" fill="#6B7378"/>
    <rect x="86.4" y="590.0" width="489.6" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

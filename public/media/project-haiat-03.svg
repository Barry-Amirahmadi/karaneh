<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#dad5cf" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dad5cf" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="73" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1920" height="1080" fill="#1B1C1E"/>

    <rect width="1920.0" height="830.8" fill="#2e2c28"/>
    <rect y="830.8" width="1920.0" height="249.2" fill="#3f3830"/>

    <rect x="153.6" y="124.0" width="1651.2" height="143.7" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="153.6,267.7 1804.8,267.7 1190.4,1080.0 -192.0,1080.0"
               fill="#FFFFFF" opacity="0.12"/>
    </g>

    <rect x="576.0" y="300.1" width="7.7" height="530.7" fill="#0f0f11" opacity="0.4"/>
    <rect x="844.8" y="300.1" width="7.7" height="530.7" fill="#0f0f11" opacity="0.4"/>
    <rect x="1113.6" y="300.1" width="7.7" height="530.7" fill="#0f0f11" opacity="0.4"/>

    <rect x="76.8" y="630.1" width="1305.6" height="200.7" fill="#7C6A52"/>
    <rect x="76.8" y="630.1" width="1305.6" height="15.1" fill="#FFFFFF" opacity="0.22"/>
    <rect x="76.8" y="809.2" width="1305.6" height="21.6" fill="#0f0f11" opacity="0.38"/>
    <rect width="1920" height="1080" fill="url(#vig)"/>
  </g>
</svg>

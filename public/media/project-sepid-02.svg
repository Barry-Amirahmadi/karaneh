<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ebeae8" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#ebeae8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="14" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="696.3" fill="#3a3a3a"/>
    <rect y="696.3" width="1440.0" height="383.7" fill="#565553"/>
    <rect width="1440.0" height="75.6" fill="#0f0f11" opacity="0.5"/>

    <rect x="855.7" y="79.2" width="399.5" height="617.1" fill="url(#open)"/>
    <rect x="855.7" y="79.2" width="11.5" height="617.1" fill="#0f0f11" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="855.7,696.3 1255.2,696.3 823.2,1080.0 222.1,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="468.6" width="57.6" height="696.3" fill="#63625e"/>
    <polygon points="468.6,696.3 526.2,696.3 367.8,1080.0 252.6,1080.0"
             fill="#0f0f11" opacity="0.32" filter="url(#soft)"/>

    <rect x="86.4" y="576.1" width="489.6" height="120.2" fill="#B7B4AC"/>
    <rect x="86.4" y="576.1" width="489.6" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#ebeae8" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#ebeae8" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="13" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="824.1" fill="#3a3a3a"/>
    <rect y="824.1" width="1440.0" height="255.9" fill="#565553"/>

    <rect x="115.2" y="135.6" width="1238.4" height="146.9" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="115.2,282.5 1353.6,282.5 892.8,1080.0 -144.0,1080.0"
               fill="#FFFFFF" opacity="0.12"/>
    </g>

    <rect x="432.0" y="314.9" width="5.8" height="509.2" fill="#0f0f11" opacity="0.4"/>
    <rect x="633.6" y="314.9" width="5.8" height="509.2" fill="#0f0f11" opacity="0.4"/>
    <rect x="835.2" y="314.9" width="5.8" height="509.2" fill="#0f0f11" opacity="0.4"/>

    <rect x="57.6" y="656.9" width="979.2" height="167.2" fill="#B7B4AC"/>
    <rect x="57.6" y="656.9" width="979.2" height="15.1" fill="#FFFFFF" opacity="0.22"/>
    <rect x="57.6" y="802.5" width="979.2" height="21.6" fill="#0f0f11" opacity="0.38"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

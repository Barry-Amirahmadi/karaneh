<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#e0dedb" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e0dedb" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="38" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="441.1" fill="#323232"/>
    <rect y="441.1" width="1440.0" height="638.9" fill="#464441"/>

    <rect x="873.5" width="282.8" height="48.6" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="873.5,0 1156.3,0 551.5,1080.0 9.5,1080.0"
               fill="#FFFFFF" opacity="0.2"/>
    </g>

    <rect x="1068.7" width="50.4" height="441.1" fill="#504d49"/>
    <polygon points="1068.7,441.1 1119.1,441.1 780.7,1080.0 679.9,1080.0"
             fill="#0f0f11" opacity="0.34" filter="url(#soft)"/>

    <rect y="441.1" width="1440.0" height="4.3" fill="#0f0f11" opacity="0.45"/>
    <rect y="735.0" width="1440.0" height="3.2" fill="#0f0f11" opacity="0.22"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

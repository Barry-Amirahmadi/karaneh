<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#dfdad3" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dfdad3" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="5" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="727.2" fill="#322f2c"/>
    <rect y="727.2" width="1440.0" height="352.8" fill="#443e36"/>
    <rect width="1440.0" height="75.6" fill="#0f0f11" opacity="0.5"/>

    <rect x="844.2" y="105.3" width="404.2" height="621.9" fill="url(#open)"/>
    <rect x="844.2" y="105.3" width="11.5" height="621.9" fill="#0f0f11" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="844.2,727.2 1248.4,727.2 816.4,1080.0 210.6,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="394.8" width="57.6" height="727.2" fill="#4e453a"/>
    <polygon points="394.8,727.2 452.4,727.2 294.0,1080.0 178.8,1080.0"
             fill="#0f0f11" opacity="0.32" filter="url(#soft)"/>

    <rect x="86.4" y="639.9" width="489.6" height="87.3" fill="#8C7A63"/>
    <rect x="86.4" y="639.9" width="489.6" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

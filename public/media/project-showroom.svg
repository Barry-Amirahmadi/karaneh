<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#e0dedb" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#e0dedb" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="37" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#1B1C1E"/>

    <rect width="1440.0" height="710.9" fill="#323232"/>
    <rect y="710.9" width="1440.0" height="369.1" fill="#464441"/>
    <rect width="1440.0" height="75.6" fill="#0f0f11" opacity="0.5"/>

    <rect x="877.1" y="120.5" width="395.6" height="590.5" fill="url(#open)"/>
    <rect x="877.1" y="120.5" width="11.5" height="590.5" fill="#0f0f11" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="877.1,710.9 1272.7,710.9 840.7,1080.0 243.5,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="398.0" width="57.6" height="710.9" fill="#504d49"/>
    <polygon points="398.0,710.9 455.6,710.9 297.2,1080.0 182.0,1080.0"
             fill="#0f0f11" opacity="0.32" filter="url(#soft)"/>

    <rect x="86.4" y="583.5" width="489.6" height="127.5" fill="#8F8A80"/>
    <rect x="86.4" y="583.5" width="489.6" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

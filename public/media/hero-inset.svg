<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#efece9" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#efece9" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1080" height="1080" fill="#EFEFED"/>

    <rect width="551.3" height="1080.0" fill="#e5e3de"/>
    <rect x="551.3" width="528.7" height="1080.0" fill="#8C7A63"/>

    <rect x="534.0" width="34.6" height="1080.0" fill="#6e6961" opacity="0.85"/>
    <rect x="568.6" width="5.4" height="1080.0" fill="#FFFFFF" opacity="0.28"/>

    <rect x="585.8" y="216.0" width="494.2" height="3.8" fill="#6e6961" opacity="0.3"/>
    <rect x="585.8" y="432.0" width="494.2" height="3.8" fill="#6e6961" opacity="0.3"/>
    <rect x="585.8" y="648.0" width="494.2" height="3.8" fill="#6e6961" opacity="0.3"/>
    <rect x="585.8" y="864.0" width="494.2" height="3.8" fill="#6e6961" opacity="0.3"/>
    <rect x="585.8" y="1080.0" width="494.2" height="3.8" fill="#6e6961" opacity="0.3"/>

    <g filter="url(#soft)">
      <polygon points="1080.0,0 1080.0,540.0 108.0,1080.0 -216.0,1080.0 -216.0,0"
               fill="#FFFFFF" opacity="0.1"/>
    </g>
    <rect y="950.4" width="1080.0" height="129.6" fill="#6e6961" opacity="0.22" filter="url(#soft)"/>
    <rect width="1080" height="1080" fill="url(#vig)"/>
  </g>
</svg>

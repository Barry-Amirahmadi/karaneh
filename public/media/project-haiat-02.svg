<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#dad5cf" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dad5cf" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="72" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1920" height="1080" fill="#1B1C1E"/>

    <rect width="1920.0" height="468.4" fill="#2e2c28"/>
    <rect y="468.4" width="1920.0" height="611.6" fill="#3f3830"/>

    <rect x="1170.2" width="324.1" height="48.6" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="1170.2,0 1494.4,0 688.0,1080.0 18.2,1080.0"
               fill="#FFFFFF" opacity="0.2"/>
    </g>

    <rect x="1451.4" width="67.2" height="468.4" fill="#463e32"/>
    <polygon points="1451.4,468.4 1518.6,468.4 1067.4,1080.0 933.0,1080.0"
             fill="#0f0f11" opacity="0.34" filter="url(#soft)"/>

    <rect y="468.4" width="1920.0" height="4.3" fill="#0f0f11" opacity="0.45"/>
    <rect y="749.7" width="1920.0" height="3.2" fill="#0f0f11" opacity="0.22"/>
    <rect width="1920" height="1080" fill="url(#vig)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#dad5cf" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#dad5cf" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="71" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1920" height="1080" fill="#1B1C1E"/>

    <rect width="1920.0" height="673.4" fill="#2e2c28"/>
    <rect y="673.4" width="1920.0" height="406.6" fill="#3f3830"/>
    <rect width="1920.0" height="75.6" fill="#0f0f11" opacity="0.5"/>

    <rect x="1078.0" y="75.8" width="461.3" height="597.7" fill="url(#open)"/>
    <rect x="1078.0" y="75.8" width="15.4" height="597.7" fill="#0f0f11" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="1078.0,673.4 1539.4,673.4 963.4,1080.0 233.2,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="556.9" width="76.8" height="673.4" fill="#463e32"/>
    <polygon points="556.9,673.4 633.7,673.4 422.5,1080.0 268.9,1080.0"
             fill="#0f0f11" opacity="0.32" filter="url(#soft)"/>

    <rect x="115.2" y="546.5" width="652.8" height="127.0" fill="#7C6A52"/>
    <rect x="115.2" y="546.5" width="652.8" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1920" height="1080" fill="url(#vig)"/>
  </g>
</svg>

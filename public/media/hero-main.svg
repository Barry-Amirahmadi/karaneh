<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#efece9" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#efece9" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#EFEFED"/>

    <rect width="1440.0" height="683.7" fill="#e3e1dc"/>
    <rect y="683.7" width="1440.0" height="396.3" fill="#a79f94"/>
    <rect width="1440.0" height="75.6" fill="#6e6961" opacity="0.5"/>

    <rect x="873.6" y="111.1" width="373.2" height="572.5" fill="url(#open)"/>
    <rect x="873.6" y="111.1" width="11.5" height="572.5" fill="#6e6961" opacity="0.7"/>

    <g filter="url(#soft)">
      <polygon points="873.6,683.7 1246.8,683.7 814.8,1080.0 240.0,1080.0"
               fill="#FFFFFF" opacity="0.15"/>
    </g>

    <rect x="378.4" width="57.6" height="683.7" fill="#8e8579"/>
    <polygon points="378.4,683.7 436.0,683.7 277.6,1080.0 162.4,1080.0"
             fill="#6e6961" opacity="0.32" filter="url(#soft)"/>

    <rect x="86.4" y="555.7" width="489.6" height="128.0" fill="#8C7A63"/>
    <rect x="86.4" y="555.7" width="489.6" height="13.0" fill="#FFFFFF" opacity="0.2"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>

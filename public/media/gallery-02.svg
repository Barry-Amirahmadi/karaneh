<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img">
  <defs>
    <linearGradient id="open" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#efefed" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#efefed" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="vig" cx="74%" cy="18%" r="96%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="48.6"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="89" result="n"/>
      <feColorMatrix type="saturate" values="0" in="n" result="g"/>
      <feComponentTransfer in="g" result="gt">
        <feFuncA type="linear" slope="0.38"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="gt" mode="overlay"/>
    </filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1440" height="1080" fill="#E1E1DE"/>

    <rect width="1440.0" height="417.2" fill="#d7d7d3"/>
    <rect y="417.2" width="1440.0" height="662.8" fill="#a2a09a"/>

    <rect x="836.5" width="280.9" height="48.6" fill="url(#open)"/>
    <g filter="url(#soft)">
      <polygon points="836.5,0 1117.4,0 512.6,1080.0 -27.5,1080.0"
               fill="#FFFFFF" opacity="0.2"/>
    </g>

    <rect x="983.3" width="50.4" height="417.2" fill="#8b8983"/>
    <polygon points="983.3,417.2 1033.7,417.2 695.3,1080.0 594.5,1080.0"
             fill="#6b6a66" opacity="0.34" filter="url(#soft)"/>

    <rect y="417.2" width="1440.0" height="4.3" fill="#6b6a66" opacity="0.45"/>
    <rect y="722.1" width="1440.0" height="3.2" fill="#6b6a66" opacity="0.22"/>
    <rect width="1440" height="1080" fill="url(#vig)"/>
  </g>
</svg>
